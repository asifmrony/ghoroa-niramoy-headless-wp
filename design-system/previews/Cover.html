<!doctype html>
<html>
<head><link rel="stylesheet" href="../tokens/tokens.css"><link rel="stylesheet" href="../css/ghoroa.css"><meta charset="utf-8"><title>Cover</title>
<style>
html,body{margin:0;background:var(--background);}
.cv{position:relative;width:960px;height:300px;overflow:hidden;background:var(--background);}
.band{position:absolute;left:0;top:0;display:block}
.deep{fill:var(--primary-deep)} .sec{fill:var(--secondary)} .pri{fill:var(--primary)} .tint{fill:var(--leaf-tint)} .amber{fill:var(--amber-line)}
.r-lg{rx:var(--radius-lg)}
.txt{position:absolute;left:48px;bottom:44px;max-width:860px}
.name{margin:0;font-family:var(--font-latin);font-weight:600;font-size:64px;line-height:.95;letter-spacing:-0.01em;color:var(--ink)}
.tag{margin:16px 0 0;font-family:var(--font-bn-alt);font-size:14px;line-height:20px;color:var(--ink-muted)}
</style></head>
<body>
<div class="cv">
<svg class="band" viewBox="0 0 960 112" width="960" height="112" aria-hidden="true">
<!--
blocks: primary-deep 336x112, secondary 224x112, primary 240x112, leaf-tint 112x112 (r = radius-lg), amber-line 48x48 disc (radius-pill) — ground = background
arrangement: a strip of unequal bands bleeding off the top, like a garden bed row; the amber disc is the one small signal (the disclaimer colour)
pattern: lens leaves (two 48px arcs = space-12) at a space-16 pitch — "a literal motif (leaf)": the logo is a house grown from two leaves
steps/radii: space-8 inset, space-12 leaf, space-16 pitch, radius-lg on the tint tile, radius-pill on the disc
-->
<rect class="deep" x="0" y="0" width="336" height="112"/>
<rect class="sec" x="336" y="0" width="224" height="112"/>
<rect class="pri" x="560" y="0" width="240" height="112"/>
<rect class="tint r-lg" x="816" y="0" width="112" height="112"/>
<circle class="amber" cx="880" cy="56" r="24"/>
<path class="tint" transform="translate(32 32)" d="M0 48A48 48 0 0 1 48 0A48 48 0 0 1 0 48Z"/><path class="tint" transform="translate(96 32) scale(-1 1) translate(-48 0)" d="M0 48A48 48 0 0 1 48 0A48 48 0 0 1 0 48Z"/><path class="tint" transform="translate(160 32)" d="M0 48A48 48 0 0 1 48 0A48 48 0 0 1 0 48Z"/><path class="tint" transform="translate(224 32) scale(-1 1) translate(-48 0)" d="M0 48A48 48 0 0 1 48 0A48 48 0 0 1 0 48Z"/><path class="tint" transform="translate(288 32)" d="M0 48A48 48 0 0 1 48 0A48 48 0 0 1 0 48Z"/><path class="deep" transform="translate(368 32) scale(-1 1) translate(-48 0)" d="M0 48A48 48 0 0 1 48 0A48 48 0 0 1 0 48Z"/><path class="deep" transform="translate(432 32)" d="M0 48A48 48 0 0 1 48 0A48 48 0 0 1 0 48Z"/><path class="deep" transform="translate(496 32) scale(-1 1) translate(-48 0)" d="M0 48A48 48 0 0 1 48 0A48 48 0 0 1 0 48Z"/>
<path class="sec" d="M592 96A64 64 0 0 1 656 32A64 64 0 0 1 592 96Z"/>
<path class="tint" d="M672 96A64 64 0 0 1 736 32A64 64 0 0 1 672 96Z" opacity="0.9"/>
</svg>
<div class="txt"><h1 class="name">GhoroaNiramoy</h1><p class="tag">প্রকৃতির যত্নে, সুস্থতার পথে — natural remedies and home gardening, in Bengali.</p></div>
</div>
</body>
</html>
