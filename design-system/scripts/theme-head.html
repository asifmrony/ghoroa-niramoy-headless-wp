<!-- Put this as the FIRST thing inside <head>, before any stylesheet, so the page never flashes the wrong theme. -->
<script>(function(){var t;try{t=localStorage.getItem('gn-theme');}catch(e){}if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);})();</script>
